# ==============================================================================
# Production Docker Compose Override
# Hardens security by closing external DB/Redis port exposures,
# configuring log rotation, and setting container resource limits.
# Usage:
#   docker compose -f docker-compose.yml -f deployment/docker-compose.prod.yml up -d
# ==============================================================================

services:
  postgres:
    # Remove public host port binding for database security
    ports: []
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
    deploy:
      resources:
        limits:
          memory: 1024M

  redis:
    # Remove public host port binding for Redis security
    ports: []
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 512M

  backend:
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
    deploy:
      resources:
        limits:
          memory: 1024M

  celery_worker:
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
    deploy:
      resources:
        limits:
          memory: 1024M

  frontend:
    ports:
      - "${FRONTEND_PORT:-80}:80"
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 256M
